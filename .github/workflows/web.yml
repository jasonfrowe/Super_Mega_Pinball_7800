# Builds the ROM and the web player (js7800_astrocart) and publishes them to
# this repository's GitHub Pages site. Pages must be set to "GitHub Actions"
# in the repository settings.

name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      emulator:
        description: js7800_astrocart branch, tag or commit
        default: astrocart

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tip: ${{ steps.tip.outputs.tip }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: jasonfrowe/js7800_astrocart
          ref: ${{ inputs.emulator || 'astrocart' }}
          path: .js7800

      - uses: bytecodealliance/actions/wasmtime/setup@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the ROM
        run: tools/build.sh

      - name: Build the emulator
        working-directory: .js7800
        run: |
          npm ci --no-audit --no-fund
          node db/convert.js db/ProSystem.dat > src/js/prosystem/ProSystemDat.js
          NODE_OPTIONS=--openssl-legacy-provider npx webpack --mode=production

      - name: Put the site together
        run: JS7800="$GITHUB_WORKSPACE/.js7800" tools/web/site.sh "$RUNNER_TEMP/site"

      # Runs for separate commits overlap, so a run deploys only while the
      # branch is still at its commit, and an older run never replaces a
      # newer site.
      - name: Check that the branch is still at this commit
        id: tip
        run: |
          set -euo pipefail
          tip=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deployed: $GITHUB_REF moved past $GITHUB_SHA during the run"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: needs.build.outputs.tip == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
